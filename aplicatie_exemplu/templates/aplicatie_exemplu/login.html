{% extends "aplicatie_exemplu/baza.html" %}
{% block content %}
<div style="max-width: 450px; margin: 20px auto; padding: 20px; background: #fff; border-radius: 10px;">
    <h1>Autentificare</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="padding: 10px 20px;">Intră în cont</button>
    </form>
    <p style="margin-top: 12px;">Nu ai cont? <a href="{% url 'inregistrare' %}">Înregistrează-te aici</a>.</p>
</div>
{% endblock %}
