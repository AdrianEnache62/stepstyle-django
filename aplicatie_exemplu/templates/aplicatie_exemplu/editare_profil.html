{% extends "aplicatie_exemplu/baza.html" %}
{% block content %}
<div style="max-width: 650px; margin: 20px auto; padding: 20px; background: #fff; border-radius: 10px;">
    <h1>Editare date și profil</h1>
    <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="padding: 10px 20px;">Salvează modificările</button>
        <a href="{% url 'profil' %}" style="margin-left: 12px;">Înapoi la profil</a>
    </form>
</div>
{% endblock %}
