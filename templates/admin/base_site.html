{% extends "admin/base.html" %}
{% load static %}

{% block extrahead %}
{{ block.super }}
<style>
    :root {
        --primary: #1f2937;
        --secondary: #374151;
        --primary-fg: #ffffff;
        --body-bg: #f3f4f6;
        --breadcrumbs-bg: #0f766e;
        --selected-row: #ccfbf1;
    }
    #branding {
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .admin-logo {
        height: 36px;
        width: auto;
        border-radius: 6px;
    }
</style>
{% endblock %}

{% block branding %}
<div id="site-name">
    <a href="{% url 'admin:index' %}" style="display: flex; align-items: center; gap: 10px;">
        <img src="{% static 'imagini/logo.png' %}" alt="Siglă StepStyle" class="admin-logo">
        <span>{{ site_header|default:_('Django administration') }}</span>
    </a>
</div>
{% endblock %}
